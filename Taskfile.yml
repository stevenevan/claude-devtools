version: '3'

tasks:
  dev:
    summary: Runs the Tauri app in development mode
    cmds:
      - bun run dev

  build:
    summary: Builds the Tauri binary without bundling
    cmds:
      - bun run build

  package:
    summary: Creates a local/testing macOS app bundle
    cmds:
      - bun run package

  typecheck:
    summary: Type-checks the frontend
    cmds:
      - bun run typecheck

  test:
    summary: Runs frontend and Rust tests
    cmds:
      - bun run test
      - bun run test:rust

  qa:
    summary: Runs all Tauri quality gates
    cmds:
      - bun run qa
